<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOOP Map Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --fg: #16181d; --muted: #61656e; --line: #e2e4e9; --bg: #fff;
    --page: #f6f7f9; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --warn-bg: #fffbeb; --bad-bg: #fef2f2; --ok-bg: #f0fdf4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 500; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); padding: 8px 14px; cursor: pointer;
  }
  button:hover { background: var(--page); }
  button.primary {
    background: var(--fg); color: #fff; border-color: var(--fg); font-weight: 500;
  }
  button.primary:disabled { background: #c8cbd2; border-color: #c8cbd2; cursor: default; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  #map { height: 220px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 20px; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .tile {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .tile.sel { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
  .tile.flag { background: var(--warn-bg); }
  .tile.dead { background: var(--bad-bg); }
  .tile.done { opacity: .62; }
  .shot { aspect-ratio: 4/3; background: #eef0f3; cursor: pointer; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .pick { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
  .pick input { margin-top: 3px; width: 17px; height: 17px; flex: none; }
  .meta { font-size: 12px; color: var(--muted); word-break: break-word; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
  }
  .b-ready { background: var(--ok-bg); color: var(--ok); }
  .b-outside, .b-unrecorded { background: #fef3c7; color: var(--warn); }
  .b-unusable, .b-blocked { background: #fee2e2; color: var(--bad); }
  .b-done { background: #eef0f3; color: var(--muted); }
  .why { font-size: 12px; color: var(--warn); }
  .tile-top { display: flex; align-items: center; gap: 8px; }
  .tile-top .badge { flex: 1; }
  .bin {
    flex: none; border: none; background: none; cursor: pointer; padding: 2px 4px;
    font-size: 15px; line-height: 1; color: var(--muted); border-radius: 6px;
  }
  .bin:hover { background: #fee2e2; color: var(--bad); }
  /* A published photo cannot be deleted from here, so it must not offer a
     bin. What it offers is the paperwork for a takedown. */
  .takedown {
    flex: none; border: 1px solid var(--line); background: none; cursor: pointer;
    padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500;
    color: var(--warn); white-space: nowrap;
  }
  .takedown:hover { background: var(--warn-bg); border-color: var(--warn); }
  .tile.gone { opacity: .4; pointer-events: none; }
  .dead .why, .blocked .why { color: var(--bad); }
  #log {
    margin-top: 20px; background: #11131a; color: #d6dae3; border-radius: 12px;
    padding: 14px 16px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; display: none;
  }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .qrow {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 16px;
  }
  .qrow .what { flex: 1; }
  .qrow .who { font-weight: 500; }
  .qrow .when { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">Loading…</h1>
    <div class="sub" id="counts"></div>
  </div>
  <div class="spacer"></div>
  <button id="back" class="hidden">Back to the queue</button>
  <button id="all" class="hidden">Select all sendable</button>
  <button id="none" class="hidden">Clear</button>
  <button id="go" class="primary hidden" disabled>Upload</button>
  <button id="recheck">Check Drive again</button>
</header>

<main>
  <section id="queue">
    <p class="note" id="queue-note">Checking Drive…</p>
    <div id="queue-list"></div>
    <div id="progress" class="note" style="display:none"></div>
  </section>

  <section id="review" style="display:none">
    <p class="note" id="folder"></p>
    <div id="map"></div>
    <div class="grid" id="grid"></div>
    <div id="log"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";

  var batch = null, map = null, markers = {};
  var el = function (id) { return document.getElementById(id); };

  var LABEL = {
    ready: "ready", outside: "outside bounds", unusable: "cannot upload",
    blocked: "wrong chapter", done: "already sent", unrecorded: "not recorded"
  };

  function log(line) {
    var box = el("log");
    box.style.display = "block";
    box.textContent += line + "\n";
    box.scrollTop = box.scrollHeight;
  }

  function sendable(p) { return p.state === "ready" || p.state === "outside"; }

  function refresh() {
    var picked = batch.photos.filter(function (p) { return p.selected; });
    el("go").disabled = picked.length === 0;
    el("go").textContent = picked.length
      ? "Upload " + picked.length + " photo" + (picked.length === 1 ? "" : "s")
      : "Upload";

    var counts = {};
    batch.photos.forEach(function (p) { counts[p.state] = (counts[p.state] || 0) + 1; });
    el("counts").textContent = Object.keys(counts).sort().map(function (k) {
      return counts[k] + " " + LABEL[k];
    }).join(" · ");

    batch.photos.forEach(function (p) {
      var t = document.getElementById("t-" + p.name);
      if (t) { t.classList.toggle("sel", !!p.selected); }
      if (markers[p.name]) {
        markers[p.name].setStyle({
          fillColor: p.selected ? "#15803d" : (p.state === "outside" ? "#b45309" : "#9aa0ab"),
          fillOpacity: p.selected ? 0.95 : 0.5
        });
      }
    });
  }

  function tile(p) {
    var d = document.createElement("div");
    d.className = "tile " + p.state;
    d.id = "t-" + p.name;
    if (p.state === "outside") { d.classList.add("flag"); }
    if (p.state === "unusable" || p.state === "blocked") { d.classList.add("dead"); }

    var shot = document.createElement("div");
    shot.className = "shot";
    var img = document.createElement("img");
    img.loading = "lazy";
    img.alt = p.name;
    img.src = "/photo/" + encodeURIComponent(p.name);
    shot.appendChild(img);
    shot.onclick = function () { window.open("/photo/" + encodeURIComponent(p.name)); };
    d.appendChild(shot);

    var body = document.createElement("div");
    body.className = "body";

    var top = document.createElement("div");
    top.className = "tile-top";

    var badge = document.createElement("span");
    badge.className = "badge b-" + p.state;
    badge.textContent = LABEL[p.state];
    top.appendChild(badge);

    var published = p.state === "done" || p.state === "unrecorded";
    var act = document.createElement("button");
    act.type = "button";
    if (published) {
      act.className = "takedown";
      act.textContent = "Request takedown";
      act.title = "Remove our copies and record what Mapillary needs to " +
                  "delete it. This does not unpublish it.";
      act.setAttribute("aria-label", "Request takedown of " + p.name);
    } else {
      act.className = "bin";
      act.textContent = "🗑";
      act.title = "Remove this submission entirely — it has not been published";
      act.setAttribute("aria-label", "Remove " + p.name + " entirely");
    }
    act.onclick = function () { remove(p, d, published); };
    top.appendChild(act);

    body.appendChild(top);

    if (sendable(p)) {
      var lab = document.createElement("label");
      lab.className = "pick";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!p.selected;
      cb.onchange = function () { p.selected = cb.checked; refresh(); };
      lab.appendChild(cb);
      var span = document.createElement("span");
      span.textContent = "Send this one";
      lab.appendChild(span);
      body.appendChild(lab);
    }

    if (p.reason) {
      var why = document.createElement("div");
      why.className = "why";
      why.textContent = p.reason;
      body.appendChild(why);
    }

    var meta = document.createElement("div");
    meta.className = "meta";
    var bits = [];
    if (p.captured) { bits.push(p.captured); }
    if (p.lat != null) { bits.push(p.lat.toFixed(5) + ", " + p.lng.toFixed(5)); }
    if (p.accuracy) { bits.push("±" + p.accuracy + " m"); }
    // A hand-placed pin from a desktop browser is the signature of a test
    // photo, which has twice needed a human decision. Worth seeing here.
    if (p.source && p.source !== "device") { bits.push(p.source); }
    bits.push(p.name);
    meta.textContent = bits.join(" · ");
    body.appendChild(meta);

    d.appendChild(body);
    return d;
  }

  function drawMap() {
    var pts = batch.photos.filter(function (p) { return p.lat != null; });
    if (!pts.length) { el("map").style.display = "none"; return; }

    map = L.map("map", { scrollWheelZoom: false });

    // The view has to exist before any vector layer is added. A map created
    // without a centre has no projection yet, so circleMarkers added first are
    // silently drawn as empty paths — no error, just an empty map.
    map.fitBounds(pts.map(function (p) { return [p.lat, p.lng]; }),
                  { padding: [30, 30], maxZoom: 16 });

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    if (batch.bounds) {
      var b = batch.bounds;
      L.rectangle([[b.south, b.west], [b.north, b.east]], {
        color: "#61656e", weight: 1, dashArray: "4 4", fill: false
      }).addTo(map);
    }

    pts.forEach(function (p) {
      var m = L.circleMarker([p.lat, p.lng], {
        radius: 7, color: "#fff", weight: 2, fillOpacity: 0.9
      }).addTo(map);
      m.bindTooltip(p.name, { direction: "top" });
      m.on("click", function () {
        var t = document.getElementById("t-" + p.name);
        if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); }
      });
      markers[p.name] = m;
    });

    // The container is laid out by now, but this map sits above a grid of
    // lazy-loading photos and the page height moves under it. Re-measuring
    // once is cheaper than debugging a map that fitted to a stale size.
    setTimeout(function () {
      map.invalidateSize();
      map.fitBounds(pts.map(function (p) { return [p.lat, p.lng]; }),
                    { padding: [30, 30], maxZoom: 16 });
    }, 250);
  }

  async function remove(p, tileEl, published) {
    // The one place a hard confirmation belongs: this is destructive and
    // cannot be undone from here. Everything else in this tool is reversible,
    // which is why nothing else asks.
    //
    // The two cases get different words because they are different actions.
    // Offering "delete" for something already public would promise what it
    // cannot do, at the moment someone is least likely to read carefully.
    var warning = published
      ? "Request takedown of this photo?\n\n" + p.name + "\n\n" +
        "It is ALREADY PUBLIC on Mapillary, and this does not unpublish it.\n\n" +
        "What this does: removes our copies (Drive, Sheet, local) and records " +
        "the cluster id you need to ask Mapillary to delete it. You then have " +
        "to make that request to Mapillary yourself."
      : "Remove this submission entirely?\n\n" + p.name + "\n\n" +
        "It has not been published, so this is a complete removal: the photo " +
        "goes to Drive's trash, the Sheet row is deleted, and the local copy " +
        "is removed.";
    if (!window.confirm(warning)) { return; }

    var reason = window.prompt(
      "Why is it being removed? This is recorded, and 'because I said so' " +
      "reads as a bug six months from now.",
      "inappropriate content");
    if (!reason || !reason.trim()) { return; }

    tileEl.classList.add("gone");
    var res = await fetch("/api/remove", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: p.name, reason: reason.trim() })
    }).then(function (r) { return r.json(); });

    if (!res.ok) {
      tileEl.classList.remove("gone");
      log("REMOVAL FAILED: " + res.error);
      return;
    }

    tileEl.remove();
    batch.photos = batch.photos.filter(function (x) { return x.name !== p.name; });
    refresh();

    log((res.stillPublicOnMapillary ? "takedown started for " : "removed ") + p.name);
    log("  trashed in Drive: " + (res.trashed || []).join(", ") || "  (no file found)");
    log("  Sheet row deleted, tombstone written to the 'removed' tab");
    if (res.stillPublicOnMapillary) {
      log("  STILL PUBLIC ON MAPILLARY — cluster " + (res.cluster || "unknown"));
      log("  Ask Mapillary to delete that cluster. Until you do, the daily");
      log("  digest will keep reporting it as an outstanding takedown.");
    }
  }

  async function run() {
    var picked = batch.photos.filter(function (p) { return p.selected; });

    // The one confirmation, and it guards the only irreversible step. The
    // Sheet write and the filing that follow get no prompt: they happen every
    // run and are undoable, and a prompt there would train the reflex that
    // makes this one get clicked through too.
    var ok = window.confirm(
      "Upload " + picked.length + " photo" + (picked.length === 1 ? "" : "s") +
      " to Mapillary as " + batch.label + "?\n\n" +
      "This is public and permanent.");
    if (!ok) { return; }

    el("go").disabled = true;
    el("go").textContent = "Uploading…";
    log("uploading " + picked.length + " photo(s) to " + batch.label + " (org " + batch.org + ")");

    var res = await fetch("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ names: picked.map(function (p) { return p.name; }) })
    }).then(function (r) { return r.json(); });

    if (!res.ok) {
      log("UPLOAD FAILED: " + res.error);
      if (res.log) { log(res.log.trim()); }
      log("nothing was recorded. the Sheet is unchanged.");
      el("go").disabled = false;
      el("go").textContent = "Upload";
      return;
    }

    log("cluster " + res.cluster + " — Mapillary registered the sequence");

    var failures = batch.photos
      .filter(function (p) { return p.state === "unusable"; })
      .map(function (p) { return { name: p.name, reason: p.reason }; });

    log("recording in the Sheet…");
    var rec = await fetch("/api/record", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ names: res.names, cluster: res.cluster, failures: failures })
    }).then(function (r) { return r.json(); });

    if (!rec.ok) {
      log("RECORDING FAILED: " + rec.error);
      log("cluster " + res.cluster + " is on Mapillary. Record it with:");
      log("  python3 tools/record_upload.py " + batch.folder);
      return;
    }

    rec.steps.forEach(function (s) {
      var r = s.result || {};
      if (!r.ok) { log("  " + s.action + ": " + r.error); return; }
      log("  " + s.action +
          " — updated " + (r.updated || []).length +
          ", unchanged " + (r.unchanged || []).length +
          ", not found " + (r.notFound || []).length +
          ", conflicts " + (r.conflicts || []).length);
      (r.conflicts || []).forEach(function (c) { log("     " + c); });
      (r.notFound || []).forEach(function (c) { log("     not found: " + c); });
    });

    if (rec.heldBack) {
      log("");
      log("NOT moving anything in Drive — the Sheet write did not fully land:");
      rec.heldBack.forEach(function (t) { log("  " + t); });
      log("inbox/ still holds this batch. Sort the Sheet out, then move it.");
      el("go").textContent = "Recorded, not filed";
      return;
    }

    (rec.moved || []).forEach(function (m) {
      var r = m.result || {};
      if (!r.ok) { log("  move to " + m.to + " failed: " + r.error); return; }
      log("  moved to " + r.to + (r.moved && r.moved.length !== undefined && typeof r.moved !== "string"
            ? " (" + r.moved.length + " file(s))" : ""));
    });

    if (rec.leftover && rec.leftover.length) {
      log("");
      log(rec.leftover.length + " photo(s) in this batch were not sent, so it");
      log("stays in inbox/. Come back for them whenever.");
      el("go").textContent = "Uploaded";
      el("go").disabled = true;
      return;
    }

    log("");
    log("done — out of the queue.");
    el("go").textContent = "Uploaded";
    el("go").disabled = true;
    el("back").textContent = "Back to the queue";
  }

  function show(view) {
    el("queue").style.display  = view === "queue"  ? "" : "none";
    el("review").style.display = view === "review" ? "" : "none";
    ["back", "all", "none", "go"].forEach(function (id) {
      el(id).classList.toggle("hidden", view !== "review");
    });
    el("recheck").classList.toggle("hidden", view !== "queue");
  }

  async function loadQueue() {
    show("queue");
    el("title").textContent = "MOOP Map Admin";
    el("counts").textContent = "";
    el("queue-note").textContent = "Checking Drive…";
    el("queue-list").innerHTML = "";

    var res = await fetch("/api/queue").then(function (r) { return r.json(); });
    if (!res.ok) {
      el("queue-note").textContent = "Could not reach Drive: " + res.error;
      return;
    }
    var batches = res.batches || [];
    if (!batches.length) {
      el("queue-note").textContent =
        "Nothing waiting. Every submission has been uploaded and filed.";
      return;
    }
    el("queue-note").textContent =
      batches.length === 1 ? "One batch waiting in Drive."
                           : batches.length + " batches waiting in Drive.";

    batches.forEach(function (b) {
      var row = document.createElement("div");
      row.className = "qrow";

      var what = document.createElement("div");
      what.className = "what";
      var who = document.createElement("div");
      who.className = "who";
      who.textContent = b.chapter;
      var when = document.createElement("div");
      when.className = "when";
      when.textContent = b.date + " · " + b.files +
                         (b.files === 1 ? " photo" : " photos");
      what.appendChild(who); what.appendChild(when);
      row.appendChild(what);

      var go = document.createElement("button");
      go.className = "primary";
      go.textContent = "Download and review";
      go.onclick = function () { download(b, go); };
      row.appendChild(go);

      el("queue-list").appendChild(row);
    });
  }

  async function download(b, button) {
    button.disabled = true;
    var prog = el("progress");
    prog.style.display = "";
    prog.textContent = "Asking Drive what is in this batch…";

    var listed = await fetch("/api/files?chapter=" + encodeURIComponent(b.chapter) +
                             "&date=" + encodeURIComponent(b.date))
      .then(function (r) { return r.json(); });
    if (!listed.ok) {
      prog.textContent = "Could not list the batch: " + listed.error;
      button.disabled = false;
      return;
    }

    // One request per photo, so this shows real progress rather than hanging
    // on a single long call — and a failure costs one photo, not the batch.
    var files = listed.files || [];
    for (var i = 0; i < files.length; i++) {
      prog.textContent = "Downloading " + (i + 1) + " of " + files.length +
                         " — " + files[i].name;
      var r = await fetch("/api/fetch-one", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chapter: b.chapter, date: b.date,
                               name: files[i].name, size: files[i].size })
      }).then(function (x) { return x.json(); });
      if (!r.ok) {
        prog.textContent = "Failed on " + files[i].name + ": " + r.error;
        button.disabled = false;
        return;
      }
    }

    prog.textContent = "Reading the Sheet…";
    var loaded = await fetch("/api/load", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chapter: b.chapter, date: b.date })
    }).then(function (r) { return r.json(); });

    prog.style.display = "none";
    button.disabled = false;
    if (loaded.ok === false) {
      prog.style.display = "";
      prog.textContent = "Could not load the batch: " + loaded.error;
      return;
    }
    render(loaded);
  }

  function render(b) {
    batch = b;
    markers = {};
    el("title").textContent = "MOOP Map Admin — " + b.label;
    el("folder").textContent = b.folder;
    el("grid").innerHTML = "";
    el("log").textContent = "";
    el("log").style.display = "none";
    el("map").style.display = "";
    el("map").innerHTML = "";
    if (map) { map.remove(); map = null; }
    b.photos.forEach(function (p) { el("grid").appendChild(tile(p)); });
    show("review");
    drawMap();
    refresh();
    el("go").disabled = !b.photos.some(function (p) { return p.selected; });
  }

  function start(b) {
    if (b && !b.empty) { render(b); } else { loadQueue(); }

    el("recheck").onclick = loadQueue;
    el("back").onclick = loadQueue;
    el("all").onclick = function () {
      batch.photos.forEach(function (p) { if (sendable(p)) { p.selected = true; } });
      document.querySelectorAll(".pick input").forEach(function (c) { c.checked = true; });
      refresh();
    };
    el("none").onclick = function () {
      batch.photos.forEach(function (p) { p.selected = false; });
      document.querySelectorAll(".pick input").forEach(function (c) { c.checked = false; });
      refresh();
    };
    el("go").onclick = run;
  }

  fetch("/api/batch").then(function (r) { return r.json(); }).then(start);
})();
</script>
</body>
</html>
