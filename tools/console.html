<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review batch — MOOP Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --fg: #16181d; --muted: #61656e; --line: #e2e4e9; --bg: #fff;
    --page: #f6f7f9; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --warn-bg: #fffbeb; --bad-bg: #fef2f2; --ok-bg: #f0fdf4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 500; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 12px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); padding: 8px 14px; cursor: pointer;
  }
  button:hover { background: var(--page); }
  button.primary {
    background: var(--fg); color: #fff; border-color: var(--fg); font-weight: 500;
  }
  button.primary:disabled { background: #c8cbd2; border-color: #c8cbd2; cursor: default; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  #map { height: 220px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 20px; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .tile {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .tile.sel { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
  .tile.flag { background: var(--warn-bg); }
  .tile.dead { background: var(--bad-bg); }
  .tile.done { opacity: .62; }
  .shot { aspect-ratio: 4/3; background: #eef0f3; cursor: pointer; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .pick { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
  .pick input { margin-top: 3px; width: 17px; height: 17px; flex: none; }
  .meta { font-size: 12px; color: var(--muted); word-break: break-word; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
  }
  .b-ready { background: var(--ok-bg); color: var(--ok); }
  .b-outside, .b-unrecorded { background: #fef3c7; color: var(--warn); }
  .b-unusable, .b-blocked { background: #fee2e2; color: var(--bad); }
  .b-done { background: #eef0f3; color: var(--muted); }
  .why { font-size: 12px; color: var(--warn); }
  .dead .why, .blocked .why { color: var(--bad); }
  #log {
    margin-top: 20px; background: #11131a; color: #d6dae3; border-radius: 12px;
    padding: 14px 16px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; display: none;
  }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">Loading…</h1>
    <div class="sub" id="counts"></div>
  </div>
  <div class="spacer"></div>
  <button id="all">Select all sendable</button>
  <button id="none">Clear</button>
  <button id="go" class="primary" disabled>Upload</button>
</header>

<main>
  <p class="note" id="folder"></p>
  <div id="map"></div>
  <div class="grid" id="grid"></div>
  <div id="log"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";

  var batch = null, map = null, markers = {};
  var el = function (id) { return document.getElementById(id); };

  var LABEL = {
    ready: "ready", outside: "outside bounds", unusable: "cannot upload",
    blocked: "wrong chapter", done: "already sent", unrecorded: "not recorded"
  };

  function log(line) {
    var box = el("log");
    box.style.display = "block";
    box.textContent += line + "\n";
    box.scrollTop = box.scrollHeight;
  }

  function sendable(p) { return p.state === "ready" || p.state === "outside"; }

  function refresh() {
    var picked = batch.photos.filter(function (p) { return p.selected; });
    el("go").disabled = picked.length === 0;
    el("go").textContent = picked.length
      ? "Upload " + picked.length + " photo" + (picked.length === 1 ? "" : "s")
      : "Upload";

    var counts = {};
    batch.photos.forEach(function (p) { counts[p.state] = (counts[p.state] || 0) + 1; });
    el("counts").textContent = Object.keys(counts).sort().map(function (k) {
      return counts[k] + " " + LABEL[k];
    }).join(" · ");

    batch.photos.forEach(function (p) {
      var t = document.getElementById("t-" + p.name);
      if (t) { t.classList.toggle("sel", !!p.selected); }
      if (markers[p.name]) {
        markers[p.name].setStyle({
          fillColor: p.selected ? "#15803d" : (p.state === "outside" ? "#b45309" : "#9aa0ab"),
          fillOpacity: p.selected ? 0.95 : 0.5
        });
      }
    });
  }

  function tile(p) {
    var d = document.createElement("div");
    d.className = "tile " + p.state;
    d.id = "t-" + p.name;
    if (p.state === "outside") { d.classList.add("flag"); }
    if (p.state === "unusable" || p.state === "blocked") { d.classList.add("dead"); }

    var shot = document.createElement("div");
    shot.className = "shot";
    var img = document.createElement("img");
    img.loading = "lazy";
    img.alt = p.name;
    img.src = "/photo/" + encodeURIComponent(p.name);
    shot.appendChild(img);
    shot.onclick = function () { window.open("/photo/" + encodeURIComponent(p.name)); };
    d.appendChild(shot);

    var body = document.createElement("div");
    body.className = "body";

    var badge = document.createElement("span");
    badge.className = "badge b-" + p.state;
    badge.textContent = LABEL[p.state];
    body.appendChild(badge);

    if (sendable(p)) {
      var lab = document.createElement("label");
      lab.className = "pick";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!p.selected;
      cb.onchange = function () { p.selected = cb.checked; refresh(); };
      lab.appendChild(cb);
      var span = document.createElement("span");
      span.textContent = "Send this one";
      lab.appendChild(span);
      body.appendChild(lab);
    }

    if (p.reason) {
      var why = document.createElement("div");
      why.className = "why";
      why.textContent = p.reason;
      body.appendChild(why);
    }

    var meta = document.createElement("div");
    meta.className = "meta";
    var bits = [];
    if (p.captured) { bits.push(p.captured); }
    if (p.lat != null) { bits.push(p.lat.toFixed(5) + ", " + p.lng.toFixed(5)); }
    if (p.accuracy) { bits.push("±" + p.accuracy + " m"); }
    // A hand-placed pin from a desktop browser is the signature of a test
    // photo, which has twice needed a human decision. Worth seeing here.
    if (p.source && p.source !== "device") { bits.push(p.source); }
    bits.push(p.name);
    meta.textContent = bits.join(" · ");
    body.appendChild(meta);

    d.appendChild(body);
    return d;
  }

  function drawMap() {
    var pts = batch.photos.filter(function (p) { return p.lat != null; });
    if (!pts.length) { el("map").style.display = "none"; return; }

    map = L.map("map", { scrollWheelZoom: false });

    // The view has to exist before any vector layer is added. A map created
    // without a centre has no projection yet, so circleMarkers added first are
    // silently drawn as empty paths — no error, just an empty map.
    map.fitBounds(pts.map(function (p) { return [p.lat, p.lng]; }),
                  { padding: [30, 30], maxZoom: 16 });

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    if (batch.bounds) {
      var b = batch.bounds;
      L.rectangle([[b.south, b.west], [b.north, b.east]], {
        color: "#61656e", weight: 1, dashArray: "4 4", fill: false
      }).addTo(map);
    }

    pts.forEach(function (p) {
      var m = L.circleMarker([p.lat, p.lng], {
        radius: 7, color: "#fff", weight: 2, fillOpacity: 0.9
      }).addTo(map);
      m.bindTooltip(p.name, { direction: "top" });
      m.on("click", function () {
        var t = document.getElementById("t-" + p.name);
        if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); }
      });
      markers[p.name] = m;
    });

    // The container is laid out by now, but this map sits above a grid of
    // lazy-loading photos and the page height moves under it. Re-measuring
    // once is cheaper than debugging a map that fitted to a stale size.
    setTimeout(function () {
      map.invalidateSize();
      map.fitBounds(pts.map(function (p) { return [p.lat, p.lng]; }),
                    { padding: [30, 30], maxZoom: 16 });
    }, 250);
  }

  async function run() {
    var picked = batch.photos.filter(function (p) { return p.selected; });

    // The one confirmation, and it guards the only irreversible step. The
    // Sheet write and the filing that follow get no prompt: they happen every
    // run and are undoable, and a prompt there would train the reflex that
    // makes this one get clicked through too.
    var ok = window.confirm(
      "Upload " + picked.length + " photo" + (picked.length === 1 ? "" : "s") +
      " to Mapillary as " + batch.label + "?\n\n" +
      "This is public and permanent.");
    if (!ok) { return; }

    el("go").disabled = true;
    el("go").textContent = "Uploading…";
    log("uploading " + picked.length + " photo(s) to " + batch.label + " (org " + batch.org + ")");

    var res = await fetch("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ names: picked.map(function (p) { return p.name; }) })
    }).then(function (r) { return r.json(); });

    if (!res.ok) {
      log("UPLOAD FAILED: " + res.error);
      if (res.log) { log(res.log.trim()); }
      log("nothing was recorded. the Sheet is unchanged.");
      el("go").disabled = false;
      el("go").textContent = "Upload";
      return;
    }

    log("cluster " + res.cluster + " — Mapillary registered the sequence");

    var failures = batch.photos
      .filter(function (p) { return p.state === "unusable"; })
      .map(function (p) { return { name: p.name, reason: p.reason }; });

    log("recording in the Sheet…");
    var rec = await fetch("/api/record", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ names: res.names, cluster: res.cluster, failures: failures })
    }).then(function (r) { return r.json(); });

    if (!rec.ok) {
      log("RECORDING FAILED: " + rec.error);
      log("cluster " + res.cluster + " is on Mapillary. Record it with:");
      log("  python3 tools/record_upload.py " + batch.folder);
      return;
    }

    rec.steps.forEach(function (s) {
      var r = s.result || {};
      if (!r.ok) { log("  " + s.action + ": " + r.error); return; }
      log("  " + s.action +
          " — updated " + (r.updated || []).length +
          ", unchanged " + (r.unchanged || []).length +
          ", not found " + (r.notFound || []).length +
          ", conflicts " + (r.conflicts || []).length);
      (r.conflicts || []).forEach(function (c) { log("     " + c); });
      (r.notFound || []).forEach(function (c) { log("     not found: " + c); });
    });

    if (rec.heldBack) {
      log("");
      log("NOT moving anything in Drive — the Sheet write did not fully land:");
      rec.heldBack.forEach(function (t) { log("  " + t); });
      log("inbox/ still holds this batch. Sort the Sheet out, then move it.");
      el("go").textContent = "Recorded, not filed";
      return;
    }

    (rec.moved || []).forEach(function (m) {
      var r = m.result || {};
      if (!r.ok) { log("  move to " + m.to + " failed: " + r.error); return; }
      log("  moved to " + r.to + (r.moved && r.moved.length !== undefined && typeof r.moved !== "string"
            ? " (" + r.moved.length + " file(s))" : ""));
    });

    log("");
    log("done — out of the queue.");
    el("go").textContent = "Uploaded";
  }

  fetch("/api/batch").then(function (r) { return r.json(); }).then(function (b) {
    batch = b;
    el("title").textContent = "Review " + b.label;
    el("folder").textContent = b.folder;
    el("grid").innerHTML = "";
    b.photos.forEach(function (p) { el("grid").appendChild(tile(p)); });
    drawMap();
    refresh();

    el("all").onclick = function () {
      batch.photos.forEach(function (p) { if (sendable(p)) { p.selected = true; } });
      document.querySelectorAll(".pick input").forEach(function (c) { c.checked = true; });
      refresh();
    };
    el("none").onclick = function () {
      batch.photos.forEach(function (p) { p.selected = false; });
      document.querySelectorAll(".pick input").forEach(function (c) { c.checked = false; });
      refresh();
    };
    el("go").onclick = run;
  });
})();
</script>
</body>
</html>
